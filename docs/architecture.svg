<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">A corrected architecture map showing the public browser UI, Express server, routes, library modules, configuration, JSON data, and the five-step order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#536779"/></marker>
    <marker id="flow-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#d8644d"/></marker>
    <style>
      .bg { fill: #f7fafc; } .header { fill: #17324d; }
      .title { font: 700 25px Arial, sans-serif; fill: white; } .sub { font: 12px Arial, sans-serif; fill: #dbe8f0; }
      .section { font: 700 13px Arial, sans-serif; letter-spacing: 1px; fill: #264653; }
      .box { fill: white; stroke: #9db1c0; stroke-width: 1.4; rx: 9; } .ui { fill: #e3f3ef; stroke: #278f83; }
      .server { fill: #e8f1fa; stroke: #477fa9; } .route { fill: #fff4dd; stroke: #cf9826; }
      .lib { fill: white; stroke: #8ba0b1; } .ticket { fill: #f5ecfb; stroke: #8759b7; stroke-width: 2; }
      .config { fill: #fff0df; stroke: #be7722; } .data { fill: #edf2f5; stroke: #687d8c; }
      .name { font: 700 14px Arial, sans-serif; fill: #17324d; } .body { font: 12px Arial, sans-serif; fill: #385166; }
      .note { font: 12px Arial, sans-serif; fill: #587083; } .edge { fill: none; stroke: #536779; stroke-width: 1.5; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #d8644d; stroke-width: 2.6; marker-end: url(#flow-arrow); }
      .step { fill: #d8644d; } .steptext { font: 700 12px Arial, sans-serif; fill: white; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="800"/>
  <rect class="header" width="1200" height="66"/>
  <text class="title" x="30" y="31">ShopLedger architecture</text>
  <text class="sub" x="30" y="52">Corrected map: arrows show request/data flow; each route card lists its direct module imports.</text>

  <text class="section" x="30" y="92">ENTRY POINTS &amp; PERSISTED CONFIGURATION</text>
  <rect class="box ui" x="30" y="105" width="235" height="100"/>
  <text class="name" x="46" y="133">public/</text>
  <text class="body" x="46" y="154">index.html · css/style.css</text>
  <text class="body" x="46" y="175">js/app.js — POS browser UI</text>
  <text class="note" x="46" y="193">Served statically by server.js</text>

  <rect class="box server" x="335" y="105" width="265" height="100"/>
  <text class="name" x="351" y="133">server.js</text>
  <text class="body" x="351" y="154">Express · bodyParser.json() · public/</text>
  <text class="body" x="351" y="175">mounts four /api routers</text>
  <text class="note" x="351" y="193">GET /orders/:id/invoice → invoice.render()</text>

  <rect class="box config" x="680" y="105" width="220" height="100"/>
  <text class="name" x="696" y="133">config.js</text>
  <text class="body" x="696" y="154">port · shop identity</text>
  <text class="body" x="696" y="175">HSN slabs · coupons · inventory</text>
  <text class="note" x="696" y="193">Imported by tax, coupons, invoice…</text>

  <rect class="box data" x="970" y="105" width="200" height="100"/>
  <text class="name" x="986" y="133">data/db.json</text>
  <text class="body" x="986" y="154">products · orders · customers</text>
  <text class="body" x="986" y="175">settlements · auditLog · counters</text>
  <text class="note" x="986" y="193">Read/written by lib/store.js</text>

  <path class="edge" d="M265 155 H335"/>
  <path class="edge" d="M600 143 H680"/>

  <text class="section" x="30" y="238">ROUTES/ — DIRECT IMPORTS ARE LISTED, NOT IMPLIED BY ARROWS</text>
  <rect class="box route" x="25" y="252" width="272" height="106"/>
  <text class="name" x="40" y="279">routes/products.js</text>
  <text class="body" x="40" y="300">GET /products · GET /coupons</text>
  <text class="note" x="40" y="324">uses: store, inventory, tax, coupons</text>

  <rect class="box route" x="315" y="252" width="272" height="106"/>
  <text class="name" x="330" y="279">routes/orders.js</text>
  <text class="body" x="330" y="300">GET /orders · POST /orders · cancel</text>
  <text class="note" x="330" y="324">uses: store, inventory, pricing, coupons,</text>
  <text class="note" x="330" y="341">orders, ledger</text>

  <rect class="box route" x="605" y="252" width="272" height="106"/>
  <text class="name" x="620" y="279">routes/customers.js</text>
  <text class="body" x="620" y="300">GET /customers · POST settlement</text>
  <text class="note" x="620" y="324">uses: store, ledger</text>

  <rect class="box route" x="895" y="252" width="280" height="106"/>
  <text class="name" x="910" y="279">routes/reports.js</text>
  <text class="body" x="910" y="300">dashboard · GST reconciliation · preview</text>
  <text class="note" x="910" y="324">uses: config, store, reports, pricing, coupons</text>

  <path class="edge" d="M468 205 V235 H160 V252"/>
  <path class="edge" d="M468 205 V252"/>
  <path class="edge" d="M468 205 V235 H740 V252"/>
  <path class="edge" d="M468 205 V235 H1035 V252"/>

  <text class="section" x="30" y="397">LIB/ — MODULE RESPONSIBILITIES</text>
  <rect class="box lib" x="25" y="412" width="210" height="102"/>
  <text class="name" x="40" y="438">coupons.js</text><text class="body" x="40" y="461">normalizeCode · validate</text><text class="body" x="40" y="482">calculateDiscount · listActive</text>
  <rect class="box lib" x="260" y="412" width="210" height="102"/>
  <text class="name" x="275" y="438">dates.js</text><text class="body" x="275" y="461">today · normalizeDateKey</text><text class="body" x="275" y="482">getFiscalYear</text>
  <rect class="box lib" x="495" y="412" width="210" height="102"/>
  <text class="name" x="510" y="438">inventory.js</text><text class="body" x="510" y="461">find · check · reserve</text><text class="body" x="510" y="482">release · summarize</text>
  <rect class="box ticket" x="730" y="412" width="210" height="102"/>
  <text class="name" x="745" y="438">invoice.js ★ ticket</text><text class="body" x="745" y="461">computeInvoiceFigures</text><text class="body" x="745" y="482">render</text>
  <rect class="box lib" x="965" y="412" width="210" height="102"/>
  <text class="name" x="980" y="438">ledger.js</text><text class="body" x="980" y="461">findCustomer · listCustomers</text><text class="body" x="980" y="482">charge/reverse/settle Khata</text>

  <rect class="box lib" x="25" y="532" width="210" height="102"/>
  <text class="name" x="40" y="558">orders.js</text><text class="body" x="40" y="581">add · get · cancel</text><text class="body" x="40" y="602">list</text>
  <rect class="box lib" x="260" y="532" width="210" height="102"/>
  <text class="name" x="275" y="558">pricing.js</text><text class="body" x="275" y="581">subtotal · discount</text><text class="body" x="275" y="602">computeTotals</text>
  <rect class="box lib" x="495" y="532" width="210" height="102"/>
  <text class="name" x="510" y="558">reports.js</text><text class="body" x="510" y="581">getDashboardSummary</text><text class="body" x="510" y="602">getGstReconciliation</text>
  <rect class="box lib" x="730" y="532" width="210" height="102"/>
  <text class="name" x="745" y="558">store.js</text><text class="body" x="745" y="581">read · write</text><text class="body" x="745" y="602">appendAudit</text>
  <rect class="box ticket" x="965" y="532" width="210" height="102"/>
  <text class="name" x="980" y="558">tax.js ★ ticket</text><text class="body" x="980" y="581">getRateForItem</text><text class="body" x="980" y="602">getSlabPercent · splitCgstSgst</text>

  <path class="edge" d="M600 190 H595 V395 H835 V412"/>
  <text class="note" x="640" y="388">invoice endpoint</text>
  <path class="edge" d="M600 583 H730"/>
  <text class="note" x="610" y="574">store.read/write</text>
  <path class="edge" d="M940 583 H1185 V205 H1070"/>
  <text class="note" x="1015" y="575">JSON persistence</text>

  <text class="section" x="30" y="669">NUMBERED ORDER PLACEMENT FLOW — routes/orders.js</text>
  <rect class="box ui" x="25" y="684" width="212" height="83"/>
  <circle class="step" cx="45" cy="704" r="11"/><text class="steptext" x="45" y="704">1</text>
  <text class="name" x="62" y="708">Browser cart</text><text class="body" x="40" y="730">#place.onclick sends items,</text><text class="body" x="40" y="749">coupon, customer and payment.</text>
  <rect class="box route" x="270" y="684" width="212" height="83"/>
  <circle class="step" cx="290" cy="704" r="11"/><text class="steptext" x="290" y="704">2</text>
  <text class="name" x="307" y="708">POST /api/orders</text><text class="body" x="285" y="730">store.read(); inventory.find()</text><text class="body" x="285" y="749">and inventory.check().</text>
  <rect class="box lib" x="515" y="684" width="212" height="83"/>
  <circle class="step" cx="535" cy="704" r="11"/><text class="steptext" x="535" y="704">3</text>
  <text class="name" x="552" y="708">Validate &amp; price</text><text class="body" x="530" y="730">coupons.validate();</text><text class="body" x="530" y="749">pricing.computeTotals().</text>
  <rect class="box lib" x="760" y="684" width="212" height="83"/>
  <circle class="step" cx="780" cy="704" r="11"/><text class="steptext" x="780" y="704">4</text>
  <text class="name" x="797" y="708">Apply business state</text><text class="body" x="775" y="730">Optional Khata charge;</text><text class="body" x="775" y="749">reserve stock; orders.add().</text>
  <rect class="box data" x="1005" y="684" width="170" height="83"/>
  <circle class="step" cx="1025" cy="704" r="11"/><text class="steptext" x="1025" y="704">5</text>
  <text class="name" x="1042" y="708">Persist</text><text class="body" x="1020" y="730">appendAudit();</text><text class="body" x="1020" y="749">store.write(db).</text>
  <path class="flow" d="M237 726 H270"/><path class="flow" d="M482 726 H515"/><path class="flow" d="M727 726 H760"/><path class="flow" d="M972 726 H1005"/>

  <rect x="25" y="780" width="18" height="14" class="ticket"/><text class="note" x="51" y="792">Ticket focus: invoice.js and tax.js</text>
  <line x1="280" y1="787" x2="315" y2="787" class="flow"/><text class="note" x="325" y="792">orange arrows: order flow</text>
  <line x1="515" y1="787" x2="550" y2="787" class="edge"/><text class="note" x="560" y="792">grey arrows: verified wiring / persistence</text>
</svg>
